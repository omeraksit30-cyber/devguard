name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (no scanners installed)
        run: python -m pytest -q
      - name: Install Trivy and Gitleaks (macOS)
        if: runner.os == 'macOS'
        run: brew install trivy gitleaks
      - name: Install Trivy and Gitleaks (Windows)
        if: runner.os == 'Windows'
        run: choco install trivy gitleaks -y --no-progress
      - name: Integration test with the real scanners
        run: python -m pytest -q -m integration -k "not browser"
